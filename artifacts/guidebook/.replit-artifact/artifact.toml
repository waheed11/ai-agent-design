kind = "web"
previewPath = "/"
title = "AI Agent Guidebook"
version = "1.0.0"
id = "artifacts/guidebook"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23908

[services.development]
run = "pnpm --filter @workspace/guidebook run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/guidebook", "run", "build" ]
publicDir = "artifacts/guidebook/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23908"
BASE_PATH = "/"
